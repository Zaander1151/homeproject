esphome:
  name: xiao-c6-bme280
  friendly_name: "XIAO C6 BME280"

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

# Enable logging via the internal USB-Serial/JTAG controller
logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key_xiao_climate

ota:
  - platform: esphome
    password: !secret ota_password

# I2C Bus Configuration (Hardware I2C on Xiao ESP32-C6)
i2c:
  sda: 0
  scl: 1
  scan: true
  frequency: 50kHz

# Sensor Configuration
sensor:
  - platform: bme280_i2c
    address: 0x76
    temperature:
      name: "BME280 Temperature"
      id: bme280_temperature
      oversampling: 16x
    humidity:
      name: "BME280 Humidity"
      id: bme280_humidity
      oversampling: 16x
    pressure:
      name: "BME280 Pressure"
      oversampling: 16x
    update_interval: 10s

  - platform: template
    name: "Dew Point"
    lambda: |-
      if (id(bme280_temperature).has_state() && id(bme280_humidity).has_state()) {
        float temp = id(bme280_temperature).state;
        float humidity = id(bme280_humidity).state;
        float a = 17.27;
        float b = 237.7;
        float alpha = ((a * temp) / (b + temp)) + log(humidity / 100.0);
        return (b * alpha) / (a - alpha);
      }
      return NAN;
    unit_of_measurement: "°C"
    icon: "mdi:weather-fog"
    update_interval: 10s

  - platform: template
    name: "Absolute Humidity"
    lambda: |-
      if (id(bme280_temperature).has_state() && id(bme280_humidity).has_state()) {
        float temp = id(bme280_temperature).state;
        float rh = id(bme280_humidity).state;
        return (6.112 * exp((17.67 * temp) / (temp + 243.5)) * rh * 2.1674) / (273.15 + temp);
      }
      return NAN;
    unit_of_measurement: "g/m³"
    icon: "mdi:water"
    update_interval: 10s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
