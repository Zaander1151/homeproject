services:
  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: homeproject-docs
    ports:
      - "8888:8000"
    volumes:
      - ./:/docs
    command: serve --dev-addr=0.0.0.0:8000
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: homeproject-docs-network
    driver: bridge
