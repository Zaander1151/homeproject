# ESP32 Relay Control
# Hardware: ESP32 DevKit + relay module (or solid state relay)
# Learning: GPIO output control, Home Assistant switch integration

esphome:
  name: relay-switch
  friendly_name: Relay Switch

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Relay-Switch Fallback"
    password: "fallback123"

captive_portal:

# Physical button input (optional)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Physical Button"
    on_press:
      - switch.toggle: relay_1

# Relay outputs
switch:
  - platform: gpio
    pin: GPIO12
    name: "Relay 1"
    id: relay_1
    icon: "mdi:power-socket-us"
    restore_mode: RESTORE_DEFAULT_OFF

  # Add more relays as needed
  # - platform: gpio
  #   pin: GPIO14
  #   name: "Relay 2"
  #   id: relay_2

# Status LED
status_led:
  pin:
    number: GPIO2
